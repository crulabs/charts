---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    toolkit.fluxcd.io/tenant: {{ .Values.team }}
    {{- range $mode, $level := .Values.podSecurity }}
    {{- if $level }}
    pod-security.kubernetes.io/{{ $mode }}: {{ $level | quote }}
    {{- end }}
    {{- end }}
