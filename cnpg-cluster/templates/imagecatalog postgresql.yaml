{{- if eq .Values.type "postgresql" }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ImageCatalog
metadata:
  name: postgresql
  namespace: {{ .Release.Namespace }}
spec:
  images:
    - major: 16
      image: ghcr.io/cloudnative-pg/postgresql:18.6
    - major: 17
      image: ghcr.io/cloudnative-pg/postgresql:18.6
    - major: 18
      image: ghcr.io/cloudnative-pg/postgresql:18.6
{{ end }}