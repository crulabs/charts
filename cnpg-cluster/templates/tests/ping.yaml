apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-ping-test
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: database-ping-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: {{ .Release.Name }}-ping-test
      labels:
        app.kubernetes.io/component: database-ping-test
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie
          command: [ 'psql', '-c', 'SELECT 1' ]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ "ALL" ]
          env:
            - name: PGHOST
              value: {{ .Release.Name }}-rw.{{ .Release.Namespace }}.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: {{ .Values.initdb.database | default .Release.Name }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.initdb.secret.name }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.initdb.secret.name }}
                  key: password
