name: lint

# Lints the charts changed in a pull request with chart-testing (helm lint,
# yamllint, Chart.yaml schema). A version bump is not required: changes can be
# merged without one and are released by the release pull request (see release.yaml).
on:
  pull_request:

concurrency:
  group: lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5.1.0

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.x'

      - uses: helm/chart-testing-action@v2.9.0

      - name: Lint changed charts
        run: ct lint --config .github/ct/ct.yaml
