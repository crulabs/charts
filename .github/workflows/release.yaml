name: release

# A chart is released when the version in its Chart.yaml has not been released
# yet: bump `version` in <chart>/Chart.yaml and merge to main. The workflow
# packages and pushes the chart and creates the git tag <chart>-<version>.
on:
  push:
    branches:
      - main
    paths:
      - '*/Chart.yaml'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    env:
      REGISTRY: oci://ghcr.io/crulabs/charts
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Login to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin

      - name: Release charts with new versions
        run: |
          set -euo pipefail
          released=0
          for chart_yaml in */Chart.yaml; do
            dir="${chart_yaml%/Chart.yaml}"
            name="$(yq -r '.name' "$chart_yaml")"
            version="$(yq -r '.version' "$chart_yaml")"
            tag="$name-$version"

            # Released versions are immutable: consumers pin the version, so
            # pushing it again would silently roll out new content.
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag: already released, skipping"
              continue
            fi
            if out="$(helm show chart "$REGISTRY/$name" --version "$version" 2>&1)"; then
              echo "::warning::$tag is in the registry but has no git tag, skipping. Push the tag by hand if that is expected."
              continue
            elif ! grep -qiE 'not found|denied' <<<"$out"; then
              echo "::error::$tag: could not check the registry: $out"
              exit 1
            fi

            echo "::group::Release $tag"
            helm lint "$dir"
            helm package "$dir"
            helm push "$name-$version.tgz" "$REGISTRY"
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
            echo "::endgroup::"
            released=$((released + 1))
          done
          echo "Released $released chart(s)"
