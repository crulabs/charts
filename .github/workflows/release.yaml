name: release

# Runs on every push to main:
# 1. release: a chart is released when the version in its Chart.yaml has not
#    been released yet. It is packaged and pushed, tagged as <chart>-<version>
#    and gets a GitHub release.
# 2. release-pr: for every chart with unreleased changes, a pull request
#    release/<chart> bumps the version and writes the changelog section. It is
#    rebuilt on every push, so it always shows what the next release contains.
#    Merging it releases the chart (step 1).
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    env:
      REGISTRY: oci://ghcr.io/crulabs/charts
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Login to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin

      - name: Release charts with new versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Prints the section "## [<version>]" of <dir>/CHANGELOG.md without
          # the heading and without leading/trailing blank lines.
          changelog_section() {
            local file="$1/CHANGELOG.md"
            [[ -f "$file" ]] || return 0
            awk -v heading="## [$2]" '
              $0 == heading { found = 1; next }
              found && /^## / { exit }
              /^<!-- generated:(start|end) -->$/ { next }
              found { lines[++n] = $0 }
              END {
                first = 1; while (first <= n && lines[first] ~ /^[[:space:]]*$/) first++
                last = n;  while (last >= first && lines[last] ~ /^[[:space:]]*$/) last--
                for (i = first; i <= last; i++) print lines[i]
              }' "$file"
          }

          # The GitHub release carries the changelog section as release notes.
          # Renovate shows these notes in the update PRs of chart consumers.
          create_release() {
            changelog_section "$1" "$3" \
              | gh release create "$2" --title "$2" --notes-file - --verify-tag
          }

          released=0
          for chart_yaml in */Chart.yaml; do
            dir="${chart_yaml%/Chart.yaml}"
            name="$(yq -r '.name' "$chart_yaml")"
            version="$(yq -r '.version' "$chart_yaml")"
            tag="$name-$version"

            # Released versions are immutable: consumers pin the version, so
            # pushing it again would silently roll out new content.
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              if gh release view "$tag" >/dev/null 2>&1; then
                echo "$tag: already released, skipping"
              else
                # A previous run pushed the tag but failed before the release.
                echo "$tag: tag exists without GitHub release, creating it"
                create_release "$dir" "$tag" "$version"
              fi
              continue
            fi

            if [[ -z "$(changelog_section "$dir" "$version")" ]]; then
              echo "::error::$tag: no entry '## [$version]' in $dir/CHANGELOG.md, not released"
              exit 1
            fi
            if out="$(helm show chart "$REGISTRY/$name" --version "$version" 2>&1)"; then
              echo "::warning::$tag is in the registry but has no git tag, skipping. Push the tag by hand if that is expected."
              continue
            elif ! grep -qiE 'not found|denied' <<<"$out"; then
              echo "::error::$tag: could not check the registry: $out"
              exit 1
            fi

            echo "::group::Release $tag"
            helm lint "$dir"
            helm package "$dir"
            helm push "$name-$version.tgz" "$REGISTRY"
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
            create_release "$dir" "$tag" "$version"
            echo "::endgroup::"
            released=$((released + 1))
          done
          echo "Released $released chart(s)"

  release-pr:
    # After the release job, so a chart that was just released starts from its
    # new tag.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # Pushes and pull requests made with GITHUB_TOKEN do not trigger other
      # workflows, so lint would not run on the release pull requests. Set the
      # secret RELEASE_TOKEN (GitHub App or fine-grained token with contents and
      # pull requests write access) to get the checks.
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Update release pull requests
        env:
          BODY_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for chart_yaml in */Chart.yaml; do
            dir="${chart_yaml%/Chart.yaml}"
            name="$(yq -r '.name' "$chart_yaml")"
            branch="release/$name"
            body="$BODY_DIR/$name.md"
            echo "::group::$name"

            remote=()
            if git rev-parse -q --verify "refs/remotes/origin/$branch" >/dev/null; then
              remote=("origin/$branch")
            fi
            pr="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"

            # The release branch is always rebuilt from main. Manual edits on it
            # (higher version, changelog notes) are carried over by the script.
            git checkout -q -f -B "$branch" origin/main
            status=0
            version="$(python3 .github/scripts/release_pr.py "$dir" "$body" "${remote[@]}")" || status=$?
            if [[ $status -eq 3 ]]; then
              echo "::endgroup::"; continue
            elif [[ $status -ne 0 ]]; then
              exit "$status"
            fi

            if [[ -z "$version" ]]; then
              if [[ -n "$pr" ]]; then
                gh pr close "$pr" --delete-branch --comment "Nothing to release anymore."
              elif [[ ${#remote[@]} -gt 0 ]]; then
                git push origin --delete "$branch"  # left over from a merged release
              fi
              echo "::endgroup::"; continue
            fi

            title="chore($name): release $version"
            git add -- "$dir/Chart.yaml" "$dir/CHANGELOG.md"
            if [[ ${#remote[@]} -gt 0 ]] && git diff --cached --quiet "${remote[0]}" \
              && [[ "$(git log -1 --format=%P "${remote[0]}")" == "$(git rev-parse origin/main)" ]]; then
              echo "$branch is up to date"
            else
              git commit -q -m "$title"
              # The lease fails if someone pushed to the branch since the fetch;
              # the next run picks that up.
              git push -q --force-with-lease="$branch" origin "$branch"
            fi

            if [[ -n "$pr" ]]; then
              gh pr edit "$pr" --title "$title" --body-file "$body"
            else
              gh pr create --base main --head "$branch" --title "$title" --body-file "$body"
            fi
            echo "::endgroup::"
          done
