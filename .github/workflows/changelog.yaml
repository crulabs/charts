name: changelog

# When a pull request bumps `version` in a <chart>/Chart.yaml, generate the
# changelog section for that version from the conventional commits since the
# previous release and commit it to the pull request branch. Notes written
# above the generated block are kept, so you can add upgrade hints by hand.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Matched against all changes of the pull request, so this runs on every
    # push to a pull request that touches a Chart.yaml.
    paths:
      - '*/Chart.yaml'

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    # Only for pull requests from branches of this repository, not from Renovate
    # (it does not bump chart versions). Renovate runs with a user token, so it is
    # recognized by its branch prefix, not by a [bot] login.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Generate changelog for bumped charts
        id: generate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          updated=()
          for chart_yaml in */Chart.yaml; do
            dir="${chart_yaml%/Chart.yaml}"
            name="$(yq -r '.name' "$chart_yaml")"
            version="$(yq -r '.version' "$chart_yaml")"
            base_version="$(git show "origin/$BASE_REF:$chart_yaml" 2>/dev/null | yq -r '.version' || true)"

            if [[ "$version" == "$base_version" ]]; then
              continue  # version not bumped in this pull request
            fi
            if git rev-parse -q --verify "refs/tags/$name-$version" >/dev/null; then
              echo "::error file=$chart_yaml::$name $version is already released, pick a new version"
              exit 1
            fi

            # Include origin/<base>: changes merged there after this branch was
            # created are released together with this pull request.
            python3 .github/scripts/changelog.py "$dir" "$version" "origin/$BASE_REF"
            updated+=("$name $version")
          done
          printf '%s\n' "${updated[@]}"
          {
            echo "summary<<EOF"
            printf '%s, ' "${updated[@]}" | sed 's/, $//'
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit changelog
        env:
          HEAD_REF: ${{ github.head_ref }}
          SUMMARY: ${{ steps.generate.outputs.summary }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- '*/CHANGELOG.md')" ]]; then
            echo "Changelog is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*/CHANGELOG.md'
          git commit -m "docs: update changelog for $SUMMARY"
          # Pushes with GITHUB_TOKEN do not trigger workflows, so this does not loop.
          git push origin "HEAD:$HEAD_REF"
