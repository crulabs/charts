apiVersion: v1
kind: Service
metadata:
  name: {{ include "vexr.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vexr.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "vexr.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.service.port }}
      targetPort: metrics
      protocol: TCP
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "vexr.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vexr.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "vexr.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      honorLabels: {{ .Values.serviceMonitor.honorLabels }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      {{- with .Values.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
