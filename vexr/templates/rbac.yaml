{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vexr.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vexr.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vexr.fullname" . }}
  labels:
    {{- include "vexr.labels" . | nindent 4 }}
# Generated from the +kubebuilder:rbac markers (make manifests), see files/clusterrole.yaml.
rules:
  {{- (.Files.Get "files/clusterrole.yaml" | fromYaml).rules | toYaml | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vexr.fullname" . }}
  labels:
    {{- include "vexr.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vexr.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "vexr.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
