apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vexr.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vexr.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml (.Values.config | default dict) | nindent 4 }}
{{- range $name, $doc := .Values.vexDocuments }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-vex-%s" (include "vexr.fullname" $) $name | trunc 63 | trimSuffix "-" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vexr.labels" $ | nindent 4 }}
    vexr.io/vex: "true"
data:
  {{ $name }}.json: |
    {{- if kindIs "string" $doc }}
    {{- $doc | nindent 4 }}
    {{- else }}
    {{- toPrettyJson $doc | nindent 4 }}
    {{- end }}
{{- end }}
